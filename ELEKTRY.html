let testQuestions = [];
let currentQuestionIndex = 0;
let selectedAnswers = [];
let selectionOrder = [];
let score = 0;
let answered = false;

// ====================== ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ ======================
function setMode(mode) {
    document.getElementById('mode-test').classList.toggle('active', mode === 'test');
    document.getElementById('mode-answers').classList.toggle('active', mode === 'answers');
    
    document.getElementById('test-mode').style.display = mode === 'test' ? 'block' : 'none';
    document.getElementById('answers-mode').style.display = mode === 'answers' ? 'block' : 'none';

    if (mode === 'test') {
        startRandomTest();
    } else {
        buildAlphabet();
        showAllQuestions();
    }
}

// ====================== РЕЖИМ ТЕСТ ======================
function startRandomTest() {
    testQuestions = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, 7);
    currentQuestionIndex = 0;
    score = 0;
    loadTestQuestion();
}

function loadTestQuestion() {
    const q = testQuestions[currentQuestionIndex];
    document.getElementById('question-text').textContent = q.q;
    document.getElementById('options').innerHTML = '';

    selectedAnswers = [];
    selectionOrder = [];
    answered = false;

    document.getElementById('next-btn').textContent = "Ответить";
    document.getElementById('next-btn').disabled = true;

    q.options.forEach((text, i) => {
        const div = document.createElement('div');
        div.classList.add('option');
        div.textContent = text;
        div.dataset.index = i;
        div.addEventListener('click', () => toggleOption(div, i, q));
        document.getElementById('options').appendChild(div);
    });

    document.getElementById('current-question').textContent = currentQuestionIndex + 1;
    document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / 7) * 100}%`;
}

function toggleOption(el, idx, q) {
    if (answered) return;

    if (q.type === "sequence") {
        if (selectionOrder.includes(idx)) {
            selectionOrder = selectionOrder.filter(i => i !== idx);
            el.classList.remove('selected');
            const num = el.querySelector('.sequence-number');
            if (num) num.remove();
        } else if (selectionOrder.length < q.correct.length) {
            selectionOrder.push(idx);
            el.classList.add('selected');

            const numDiv = document.createElement('div');
            numDiv.className = 'sequence-number';
            numDiv.textContent = selectionOrder.length;
            el.appendChild(numDiv);
        }
    } else {
        const maxSelect = q.correct.length;
        if (selectedAnswers.includes(idx)) {
            selectedAnswers = selectedAnswers.filter(i => i !== idx);
            el.classList.remove('selected');
        } else if (selectedAnswers.length < maxSelect) {
            if (maxSelect === 1) {
                selectedAnswers = [idx];
                document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            } else {
                selectedAnswers.push(idx);
            }
            el.classList.add('selected');
        }
    }

    document.getElementById('next-btn').disabled = 
        (q.type === "sequence" ? selectionOrder.length === 0 : selectedAnswers.length === 0);
}

function checkAnswer() {
    answered = true;
    const q = testQuestions[currentQuestionIndex];

    let isCorrect = false;
    if (q.type === "sequence") {
        isCorrect = JSON.stringify(selectionOrder) === JSON.stringify(q.correct);
    } else {
        isCorrect = JSON.stringify([...selectedAnswers].sort((a,b)=>a-b)) === 
                    JSON.stringify([...q.correct].sort((a,b)=>a-b));
    }

    if (isCorrect) score++;

    document.querySelectorAll('.option').forEach(opt => {
        const idx = parseInt(opt.dataset.index);
        opt.style.pointerEvents = "none";

        if (q.correct.includes(idx)) {
            opt.classList.add('correct');
            if (q.type === "sequence") {
                const pos = q.correct.indexOf(idx) + 1;
                const n = document.createElement('div');
                n.className = 'correct-number';
                n.textContent = pos;
                opt.appendChild(n);
            }
        }

        if ((selectedAnswers.includes(idx) || selectionOrder.includes(idx)) && !q.correct.includes(idx)) {
            opt.classList.add('incorrect');
        }
        if (q.type === "sequence" && selectionOrder.includes(idx) && !isCorrect) {
            opt.classList.add('incorrect');
        }
    });

    document.getElementById('next-btn').textContent = (currentQuestionIndex < 6) ? "Следующий вопрос" : "Завершить тест";
    document.getElementById('next-btn').disabled = false;
}

function nextQuestion() {
    if (!answered) { checkAnswer(); return; }
    currentQuestionIndex++;
    if (currentQuestionIndex < 7) loadTestQuestion();
    else showResult();
}

function showResult() {
    document.getElementById('test-mode').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    const perc = Math.round((score / 7) * 100);
    document.getElementById('final-score').innerHTML = `Ваш результат: <strong>\( {score} из 7</strong> ( \){perc}%)`;
}

// ====================== РЕЖИМ ОТВЕТОВ + ЖИВОЙ ПОИСК ======================
function buildAlphabet() {
    const alphabetDiv = document.getElementById('alphabet');
    alphabetDiv.innerHTML = '';
    const usedLetters = new Set();
    allQuestions.forEach(q => {
        const first = q.q.trim()[0].toUpperCase();
        if (/^[А-ЯЁ]$/.test(first)) usedLetters.add(first);
    });
    Array.from(usedLetters).sort().forEach(letter => {
        const btn = document.createElement('div');
        btn.className = 'letter-btn';
        btn.textContent = letter;
        btn.onclick = () => filterByLetter(letter);
        alphabetDiv.appendChild(btn);
    });
}

function filterByLetter(letter) {
    document.querySelectorAll('.letter-btn').forEach(btn => btn.classList.remove('active'));
    if (event && event.currentTarget) event.currentTarget.classList.add('active');

    const filtered = allQuestions.filter(q => q.q.trim().toUpperCase().startsWith(letter));
    renderQuestionList(filtered);
}

function showAllQuestions() {
    renderQuestionList(allQuestions);
}

function renderQuestionList(list) {
    const container = document.getElementById('question-list');
    container.innerHTML = '';
    document.getElementById('answer-detail').style.display = 'none';
    container.style.display = 'block';

    if (list.length === 0) {
        container.innerHTML = '<p style="padding:20px; color:#666; text-align:center;">Ничего не найдено</p>';
        return;
    }

    list.forEach(q => {
        const idx = allQuestions.indexOf(q);
        const item = document.createElement('div');
        item.className = 'question-item';
        item.textContent = q.q;
        item.onclick = () => showAnswerDetail(idx);
        container.appendChild(item);
    });
}

// === ЖИВОЙ ПОИСК ===
function filterQuestions() {
    const term = document.getElementById('search-input').value.toLowerCase().trim();
    const filtered = allQuestions.filter(q => 
        q.q.toLowerCase().includes(term)
    );
    renderQuestionList(filtered);
}

// ====================== ПРОСМОТР ОТВЕТА ======================
function showAnswerDetail(idx) {
    const q = allQuestions[idx];
    document.getElementById('question-list').style.display = 'none';
    document.getElementById('answer-detail').style.display = 'block';
    document.getElementById('detail-question').textContent = q.q;

    const optsDiv = document.getElementById('detail-options');
    optsDiv.innerHTML = '';

    q.correct.forEach((correctIdx, order) => {
        const opt = document.createElement('div');
        opt.classList.add('option', 'correct');
        opt.textContent = q.options[correctIdx];
        if (q.type === "sequence") {
            const num = document.createElement('div');
            num.className = 'correct-number';
            num.textContent = order + 1;
            opt.appendChild(num);
        }
        optsDiv.appendChild(opt);
    });
}

function restartQuiz() {
    document.getElementById('result-screen').style.display = 'none';
    setMode('test');
}

// ====================== ЗАПУСК ======================
setMode('test');

// Автозапуск живого поиска при вводе
document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
        searchInput.addEventListener('input', filterQuestions);
    }
});
